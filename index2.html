<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Módulo de Instrucción Virtual - The Waterfront</title>

  <!-- Favicon existente -->
  <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png">

  <!-- Fuentes: Roboto (para textos) y una fuente seria/militar para el título -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald:600"> <!-- Fuente seria y geométrica -->
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }
    /* SE HA ELIMINADO TODO EL CSS DEL PRELOADER */
  </style>
  
  <!-- Scripts Principales -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <script>
    // --- COMPONENTE PARA GESTIONAR ENLACES ---
    // Mantiene la lógica de hover (entrar/salir) y añade la redirección.
    AFRAME.registerComponent('link-handler', {
      schema: {
        url: {type: 'string', default: ''}
      },
      init: function () {
        var el = this.el;
        var data = this.data;

        // Evento 'click': Se dispara por clic físico O por la FUSIÓN del cursor.
        el.addEventListener('click', function () {
          if (data.url) {
            console.log("Redirigiendo a:", data.url);
            // Usamos location.href para asegurar redirección en la misma pestaña
            // si la fusión es bloqueada como pop-up.
            window.location.href = data.url; 
            
            // Si prefieres nueva pestaña (puede ser bloqueado por el navegador):
            // window.open(data.url, '_blank');
          }
        });

        // --- EFECTOS VISUALES 'VIVOS' (HOVER) ---
        // Al entrar el cursor
        el.addEventListener('mouseenter', function () {
          // Pausar animación de pulso base si existe y agrandar
          el.setAttribute('animation__hoverin', {
            property: 'scale',
            to: '1.2 1.2 1.2',
            dur: 200,
            easing: 'easeOutCubic'
          });
        });

        // Al salir el cursor
        el.addEventListener('mouseleave', function () {
          // Volver a escala normal
          el.removeAttribute('animation__hoverin');
          el.setAttribute('scale', '1 1 1');
        });
      }
    });
  </script>
</head>
<body>
  
  <!-- SE HA ELIMINADO EL DIV DEL PRELOADER -->

  <a-scene>
    <!-- Gestión de Assets -->
    <a-assets>
      <img id="sky-img" src="bbb.png">
      <img id="view-icon" src="view.png">
    </a-assets>

    <!-- Fondo 360 -->
    <a-sky src="#sky-img" rotation="0 -130 0"></a-sky>

    <!-- ========================================================== -->
    <!-- CÁMARA Y CURSOR DE FUSIÓN (COPIADO DEL EJEMPLO INICIAL) -->
    <!-- Esta es la entidad que gestiona la selección por tiempo. -->
    <!-- ========================================================== -->
    <a-entity id="main-camera-wrapper" position="0 1.6 0" rotation="0 0 0">
      <a-camera id="main-camera" wasd-controls="enabled: false;" cursor="rayOrigin: mouse;" raycaster="objects: .clickable">
        
        <!-- Cursor central fijo (Círculo Azul) -->
        <a-cursor id="fuse-cursor" objects=".clickable" fuse="true" timeout="1500"
                  position="0 0 -1" geometry="radiusInner: 0.02; radiusOuter: 0.03;"
                  color="blue" shader="flat" visible="true"></a-cursor>

        <!-- Anillo de progreso de Fusión (Cian) -->
        <!-- La animación reduce thetaLength de 360 a 0 en 1.5s al detectar hover -->
        <a-ring id="fuse-progress" position="0 0 -0.999" radius-inner="0.02" radius-outer="0.03"
                theta-length="360" theta-start="90" color="#348aa7" opacity="0" shader="flat"
                animation="startEvents: fusing; property: geometry.thetaLength; from: 360; to: 0; dur: 1500; easing: linear;"
                animation__1="startEvents: fusing; property: opacity; from: 0; to: 1; dur: 200; easing: linear;"
                animation__2="startEvents: mouseleave; property: opacity; to: 0; dur: 200; easing: linear;"
                animation__3="startEvents: mouseleave; property: geometry.thetaLength; to: 360; dur: 0;">
        </a-ring>
      </a-camera>
    </a-entity>

    <!-- ========================================================== -->
    <!-- CONTENEDOR DEL MENÚ (Ubicación: Arriba y Separados) -->
    <!-- ========================================================== -->
    <a-entity id="menu-container" position="0 2.5 -4">
      
      <!-- === TÍTULO PRINCIPAL === -->
      <!-- Título grande y en negrita usando la fuente Oswald, posicionado arriba de los botones -->
      <a-text value="MODULO DE INSTRUCCION VIRTUAL" font-weight="bold" align="center" color="#FFF" position="0 1 0"  width="10"  font="roboto"></a-text>
      <!-- <a-text value="INFO 2"                        align="center" color="#FFF" position="0 -0.8 0" width="4"  font="roboto"></a-text>-->
      <!-- === BOTONES HORIZONTALES (Espaciado aumentado: 1.8m) === -->

      <!-- BOTÓN 1: PUENTE (Extrema Izquierda) -->
      <!-- Configurado con la clase .clickable y el enlace correcto -->
      <a-entity id="btn-1" position="-2.7 0 0">
        <!-- Esfera interactiva (Verde) con icono -->
        <a-sphere class="clickable" radius="0.5" color="#4CAF50" shader="flat"
                  link-handler="url: https://daanca96.github.io/comunicaciones/">
          <!--<a-image src="#view-icon" scale="0.6 0.6 0.6" position="0 0 0.51"></a-image>-->
          <a-image src="puente.png" ></a-image>
        </sphere>
        <!-- SUBTÍTULO: PUENTE -->
        <a-text value="PUENTE" align="center" color="#FFF" position="0 -0.8 0" width="4" font="roboto"></a-text>
      </a-entity>

      <!-- BOTÓN 2 (Centro-Izquierda) -->
      <a-entity id="btn-2" position="-0.9 0 0">
        <a-sphere class="clickable" radius="0.5" color="#2196F3" shader="flat"
                  link-handler="url: https://www.wikipedia.org">
          <a-image src="#view-icon" scale="0.6 0.6 0.6" position="0 0 0.51"></a-image>
        </sphere>
        <a-text value="INFO 2" align="center" color="#FFF" position="0 -0.8 0" width="4" font="roboto"></a-text>
      </a-entity>

      <!-- BOTÓN 3 (Centro-Derecha) -->
      <a-entity id="btn-3" position="0.9 0 0">
        <a-sphere class="clickable" radius="0.5" color="#FF9800" shader="flat"
                  link-handler="url: https://aframe.io">
          <a-image src="#view-icon" scale="0.6 0.6 0.6" position="0 0 0.51"></a-image>
        </sphere>
        <a-text value="INFO 3" align="center" color="#FFF" position="0 -0.8 0" width="4" font="roboto"></a-text>
      </a-entity>

      <!-- BOTÓN 4 (Extrema Derecha) -->
      <a-entity id="btn-4" position="2.7 0 0">
        <a-sphere class="clickable" radius="0.5" color="#E91E63" shader="flat"
                  link-handler="url: https://github.com">
          <a-image src="#view-icon" scale="0.6 0.6 0.6" position="0 0 0.51"></a-image>
        </sphere>
        <a-text value="INFO 4" align="center" color="#FFF" position="0 -0.8 0" width="4" font="roboto"></a-text>
      </a-entity>

    </a-entity>

  </a-scene>

</body>
</html>
